<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Usage Graph — Packet Cats</title>
<!-- Tailwind CDN: DEKORASI SAJA (badge, text util, spacing).
     FALLBACK: kalau CDN gagal load (offline), semua warna & layout kritikal
     (background, node card, posisi absolut %, SVG edges, animasi) tetap jalan
     karena didefinisikan di <style> custom di bawah. -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#0a0a0a; --card:#141414; --card2:#0f0f0f; --bd:#262626;
    --fg:#e5e5e5; --muted:#8a8a8a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{min-height:100%;display:flex;flex-direction:column}
  .graph{position:relative;width:100%;flex:1;min-height:520px;overflow:hidden}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  /* ---------- NODES ---------- */
  .node{
    position:absolute;transform:translate(-50%,-50%);
    background:var(--card);border:1px solid var(--bd);border-radius:14px;
    padding:10px 14px;min-width:150px;cursor:pointer;
    transition:border-color .25s ease, box-shadow .25s ease, transform .25s ease;
    z-index:3;user-select:none;
  }
  .node:hover{border-color:var(--nc,#3f3f3f);
    box-shadow:0 0 0 1px var(--nc,#3f3f3f),0 0 22px -4px var(--nc,#3f3f3f);
    transform:translate(-50%,-50%) scale(1.04)}
  .node .row{display:flex;align-items:center;gap:10px}
  .node .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    font-size:14px;background:color-mix(in oklab,var(--nc) 22%,#000);
    border:1px solid color-mix(in oklab,var(--nc) 45%,#000)}
  .node .lb{font-size:13px;font-weight:600;line-height:1.1}
  .node .sb{font-size:10.5px;color:var(--muted);margin-top:2px}
  .node.hub{min-width:0;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 50% 40%,#1b1b1b,#0d0d0d);
    display:grid;place-items:center;padding:0}
  @keyframes nodePing{
    0%{box-shadow:0 0 0 0 var(--nc),0 0 26px -2px var(--nc);border-color:var(--nc)}
    100%{box-shadow:0 0 0 10px transparent,0 0 0 transparent;border-color:var(--bd)}
  }
  .node.ping{animation:nodePing .7s ease-out}

  /* ---------- EDGES ---------- */
  .edge{stroke:#1f1f1f;stroke-width:2;fill:none;transition:stroke .3s ease,opacity .3s ease;opacity:.9}
  .edge.live{stroke-width:2.4;stroke-dasharray:7 9;animation:dashFlow .6s linear infinite;
    filter:drop-shadow(0 0 6px currentColor)}
  @keyframes dashFlow{to{stroke-dashoffset:-32}}

  /* ---------- CAT ---------- */
  .packet-cat{position:absolute;left:0;top:0;width:54px;height:54px;
    transform-origin:50% 50%;pointer-events:none;z-index:5;will-change:transform,opacity}
  .cat-rot{width:100%;height:100%;transform-origin:50% 50%}
  .cat-body{transform-origin:50% 50%}
  .leg{transform-box:fill-box;animation-play-state:paused;animation:none}
  @keyframes stepA{0%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}100%{transform:rotate(-18deg)}}
  @keyframes stepB{0%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}100%{transform:rotate(18deg)}}
  @keyframes bodyBob{0%,100%{transform:translateY(0)}25%{transform:translateY(-1.5px)}75%{transform:translateY(1.5px)}}
  .packet-cat.walking .leg{animation-duration:.45s;animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;animation-play-state:running}
  .packet-cat.walking .leg-front-left,
  .packet-cat.walking .leg-back-right{animation-name:stepA}
  .packet-cat.walking .leg-front-right,
  .packet-cat.walking .leg-back-left{animation-name:stepB}
  .packet-cat.walking .cat-body{animation:bodyBob .45s ease-in-out infinite}
  @keyframes tailWag{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
  .tail{transform-box:fill-box;transform-origin:0% 50%;animation:tailWag .9s ease-in-out infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 3.4s ease-in-out infinite}
</style>
</head>
<body>
<div class="wrap">
  <header class="px-6 py-4 border-b" style="border-color:var(--bd)">
    <div class="flex items-center justify-between gap-4">
      <div>
        <h1 class="text-sm font-semibold tracking-wide">Usage Graph</h1>
        <p class="text-[11px]" style="color:var(--muted)">Klik node untuk kirim paket · setiap kabel punya aliran kucing sendiri</p>
      </div>
      <span class="text-[10px] px-2 py-1 rounded-full border"
        style="border-color:var(--bd);color:var(--muted)">live · dummy data</span>
    </div>
  </header>

  <div class="graph" id="graph">
    <svg class="edges" id="edges" preserveAspectRatio="none"></svg>
    <div class="node hub" id="hub" style="left:50%;top:50%;--nc:#f5a623">
      <div class="text-center">
        <div class="text-[22px]">🐾</div>
        <div class="text-[11px] font-semibold mt-0.5">Router Hub</div>
        <div class="text-[9.5px]" style="color:var(--muted)">9Router</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------- DUMMY NODES (hardcoded) ---------- */
const NODES = [
  { id:'combo',     label:'Combo: Main', sub:'12.4k req · mixed',  icon:'🧩', angle:-90, color:'#f5a623' },
  { id:'openai',    label:'OpenAI',      sub:'gpt-5 · 4.1k req',   icon:'◎',  angle:-30, color:'#10b981' },
  { id:'anthropic', label:'Anthropic',   sub:'claude · 3.3k req',  icon:'✳',  angle:30,  color:'#e07a5f' },
  { id:'gemini',    label:'Gemini',      sub:'2.5-pro · 2.1k req', icon:'✦',  angle:90,  color:'#4f8cff' },
  { id:'kiro',      label:'Kiro',        sub:'agent · 940 req',    icon:'◆',  angle:150, color:'#a855f7' },
  { id:'cmdcode',   label:'Command Code',sub:'cli · 610 req',      icon:'⌘',  angle:210, color:'#22d3ee' },
];
const RADIUS_X = 34, RADIUS_Y = 33;           // persen -> auto re-center saat resize
const graph = document.getElementById('graph');
const svg   = document.getElementById('edges');
const HUB   = { x:50, y:50 };
const state = {};                              // per-node counter + refs

/* ---------- BUILD ---------- */
NODES.forEach(n=>{
  const rad = n.angle*Math.PI/180;
  const px = HUB.x + Math.cos(rad)*RADIUS_X;
  const py = HUB.y + Math.sin(rad)*RADIUS_Y;

  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('class','edge');
  line.setAttribute('x1',HUB.x+'%'); line.setAttribute('y1',HUB.y+'%');
  line.setAttribute('x2',px+'%');    line.setAttribute('y2',py+'%');
  svg.appendChild(line);

  const el = document.createElement('div');
  el.className='node';
  el.style.left=px+'%'; el.style.top=py+'%'; el.style.setProperty('--nc',n.color);
  el.innerHTML=`<div class="row">
      <div class="ico">${n.icon}</div>
      <div><div class="lb">${n.label}</div><div class="sb">${n.sub}</div></div>
    </div>`;
  el.addEventListener('click',()=>sendCat(n.id));
  graph.appendChild(el);

  state[n.id]={ node:n, el, line, px, py, active:0, glowTimer:null };
});

/* ---------- CAT SVG ---------- */
function catSVG(color){
  return `<div class="cat-rot">
  <svg viewBox="0 0 54 54" width="54" height="54">
    <!-- legs: pangkal nempel body, transform-origin di pangkal (atas) -->
    <g class="leg leg-front-left"  style="transform-origin:50% 0%"><rect x="15" y="20" width="3.2" height="11" rx="1.6" fill="#3b3b3b"/></g>
    <g class="leg leg-front-right" style="transform-origin:50% 0%"><rect x="34" y="20" width="3.2" height="11" rx="1.6" fill="#3b3b3b"/></g>
    <g class="leg leg-back-left"   style="transform-origin:50% 0%"><rect x="16" y="30" width="3.2" height="12" rx="1.6" fill="#333"/></g>
    <g class="leg leg-back-right"  style="transform-origin:50% 0%"><rect x="33" y="30" width="3.2" height="12" rx="1.6" fill="#333"/></g>
    <!-- tail -->
    <g class="tail"><path d="M27 41 C27 47, 33 49, 36 45" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round"/></g>
    <!-- body -->
    <g class="cat-body">
      <ellipse cx="27" cy="30" rx="10.5" ry="13" fill="#1e1e1e" stroke="${color}" stroke-width="1.4"/>
      <!-- head + ears -->
      <path d="M20 15 L18 8 L24.5 12 Z" fill="#232323" stroke="${color}" stroke-width="1.1"/>
      <path d="M34 15 L36 8 L29.5 12 Z" fill="#232323" stroke="${color}" stroke-width="1.1"/>
      <circle cx="27" cy="16" r="8.4" fill="#242424" stroke="${color}" stroke-width="1.4"/>
      <g class="eyes">
        <circle cx="24" cy="15" r="1.5" fill="${color}"/>
        <circle cx="30" cy="15" r="1.5" fill="${color}"/>
      </g>
      <path d="M25.6 18.6 q1.4 1.4 2.8 0" stroke="${color}" stroke-width="1" fill="none" stroke-linecap="round"/>
    </g>
  </svg></div>`;
}

/* ---------- EDGE GLOW ---------- */
function glow(s,on){
  if(on){ s.line.classList.add('live'); s.line.style.stroke=s.node.color; s.line.style.color=s.node.color; }
  else  { s.line.classList.remove('live'); s.line.style.stroke=''; }
}

/* ---------- SPAWN + WALK ---------- */
const easeOut = t => 1-Math.pow(1-t,3);

function sendCat(id){
  const s = state[id];
  if(!s || s.active >= MAX_PER_NODE) return;    // batas kucing per node tujuan
  s.active++;
  clearTimeout(s.glowTimer); glow(s,true);

  const r = graph.getBoundingClientRect();
  const hx = r.width*HUB.x/100, hy = r.height*HUB.y/100;
  const tx = r.width*s.px/100,  ty = r.height*s.py/100;
  const ang = Math.atan2(ty-hy, tx-hx);
  // jalan sampai node tujuan (berhenti ~46px sebelum kartu supaya tidak menimpa)
  const full = Math.hypot(tx-hx, ty-hy);
  const dist = Math.max(60, full - 46);
  const jx = (Math.random()-0.5)*18, jy = (Math.random()-0.5)*18; // jitter anti-tumpuk

  const cat = document.createElement('div');
  cat.className='packet-cat';
  cat.innerHTML = catSVG(s.node.color);
  graph.appendChild(cat);
  const rot = cat.querySelector('.cat-rot');
  rot.style.transform = `rotate(${ang*180/Math.PI + 90}deg)`; // SVG kucing default hadap "atas"

  const place=(x,y,sc,op)=>{
    cat.style.transform=`translate(${x-27}px,${y-27}px) scale(${sc})`;
    cat.style.opacity=op;
  };

  // 1) pop-in
  const T0=performance.now(), POP=180;
  (function pop(now){
    const t=Math.min(1,(now-T0)/POP);
    place(hx,hy,0.4+0.6*easeOut(t),t);
    t<1 ? requestAnimationFrame(pop) : walk();
  })(T0);

  // 2) walk (rAF posisi + CSS keyframes kaki, terpisah)
  function walk(){
    cat.classList.add('walking');
    // durasi proporsional jarak, kecepatan ~150px/s biar langkah kaki tetap jelas
    const dur = Math.min(4200, Math.max(1200, dist/150*1000)), t0=performance.now();
    const ex = hx+Math.cos(ang)*dist+jx, ey = hy+Math.sin(ang)*dist+jy;
    (function step(now){
      const t=Math.min(1,(now-t0)/dur), e=easeOut(t);
      place(hx+(ex-hx)*e, hy+(ey-hy)*e, 1, 1);
      t<1 ? requestAnimationFrame(step) : vanish(ex,ey);
    })(t0);
  }

  // 3) vanish
  function vanish(x,y){
    cat.classList.remove('walking');
    const dur=500, t0=performance.now();
    (function fade(now){
      const t=Math.min(1,(now-t0)/dur);
      place(x,y-6*t,1-t*0.95,1-t);
      if(t<1) requestAnimationFrame(fade);
      else{
        cat.remove(); s.active--;
        s.el.classList.remove('ping'); void s.el.offsetWidth; s.el.classList.add('ping');
        s.glowTimer=setTimeout(()=>{ if(s.active===0) glow(s,false); },900);
      }
    })(t0);
  }
}

/* ---------- AUTO CYCLE ---------- */
// Setiap kabel/edge punya stream kucing sendiri (bukan 1 kucing global):
// tiap node terus-menerus dikirimi paket, jadi semua kabel selalu "hidup".
const MAX_PER_NODE = 6;
function stream(id, rate){
  sendCat(id);
  setTimeout(()=>stream(id, rate), rate*(0.6+Math.random()*0.9));
}
NODES.forEach((n,i)=>{
  // node dengan traffic lebih besar (combo/openai) dikirimi lebih rapat
  const rate = 380 + i*90;
  for(let k=0;k<2;k++) setTimeout(()=>sendCat(n.id), 150 + i*90 + k*260);
  setTimeout(()=>stream(n.id, rate), 400 + i*110);
});
</script>
</body>
</html>
